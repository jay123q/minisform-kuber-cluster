---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: schizo-bot
  namespace: flux-system
spec:
  interval: 1m0s
  url: ssh://git@github.com/jay123q/schizo-bot.git
  ref:
    branch: main
  secretRef:
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: schizo-bot
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: schizo-bot
  path: ./cluster
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
  - apiVersion: apps/v1
    kind: Deployment
    name: schizo-bot
    namespace: schizo-bot
